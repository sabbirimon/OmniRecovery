[package]
name = "omnirecovery-desktop"
version = "0.3.5"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
base64 = "0.22"
getrandom = "0.4"
omnirecovery = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = "2"
tauri-plugin-dialog = "2"
tempfile = "3"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
rustix = { version = "1", features = ["fs"] }
